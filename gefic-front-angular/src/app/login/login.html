<body>

<div class="background">

    <div class="login-card">

        <h1>GEFIC</h1>

        <div class="logo">

            <img src="gefic-front-angular\public\logo.png" alt="Logo GEFIC">

        </div>

        <p class="subtitle">
            Faça login para acessar o sistema
        </p>

        <form>

            <div class="input-group">

                <i class="fa-regular fa-user"></i>

                <input
                        type="text"
                        placeholder="Login">

            </div>

            <div class="input-group">

                <i class="fa-solid fa-lock"></i>

                <input
                        type="password"
                        placeholder="Senha">

                <i class="fa-regular fa-eye eye"></i>

            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Lembrar-me

                </label>

                <a href="#">

                    Esqueceu sua senha?

                </a>

            </div>

            <button type="submit">

                <i class="fa-solid fa-right-to-bracket"></i>

                Entrar

            </button>

        </form>

        <div class="separator">

            <span>ou</span>

        </div>

        <footer>

            © 2026 GEFIC. Todos os direitos reservados.

        </footer>

    </div>

</div>

</body>
