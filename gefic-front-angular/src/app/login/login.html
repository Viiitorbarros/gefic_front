<body>

<div class="background">

    <div class="login-card">

        <h1>GEFIC</h1>

        <div class="logo">

            <img src="logo.png" alt="Logo GEFIC">

        </div>

        <p class="subtitle">
            Faça login para acessar o sistema
        </p>

        <form>

            <div class="input-group">

                <i class="fa-regular fa-user"></i>

                <input
                        type="text"
                        placeholder="Login"
                        name = "Username"
                        [(ngModel)]="credenciais.username" >
                        

            </div>

            <div class="input-group">

                <i class="fa-solid fa-lock"></i>

                <input
                        type="password"
                        placeholder="Senha"
                        name="password"
                        [(ngModel)]="credenciais.password">

                <i class="fa-regular fa-eye eye"></i>

            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Lembrar-me

                </label>

                <a href="#">

                    Esqueceu sua senha?

                </a>

            </div>

           <button type="button" (click)="entrar()">
            
                <i class="fa-solid fa-right-to-bracket"></i>
                Entrar
        </button>

        </form>

        <div class="separator">

            <span>ou</span>

        </div>

        <footer>

            © 2026 GEFIC. Todos os direitos reservados.

        </footer>

    </div>

</div>

</body>
